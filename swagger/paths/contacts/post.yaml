tags:
  - Contacts
summary: Create contact
operationId: createContact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: +380987654321
          email:
            type: string
            format: email
            example: john@example.com
          contactType:
            type: string
            example: personal
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
