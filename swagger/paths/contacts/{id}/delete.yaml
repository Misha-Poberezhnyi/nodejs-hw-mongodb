tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: Permanently delete a contact by its unique ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
responses:
  '200':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact deleted
  '404':
    description: Contact not found
